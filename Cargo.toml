[package]
name = "dataskill"
version = "0.1.0"
edition = "2024"
description = "A guard between coding agents and your data warehouse: read-only, cost-checked SQL plus schema memory."
license = "MIT"
repository = "https://github.com/manneyugn/dataskill"
keywords = ["sql", "bigquery", "postgres", "mcp", "agents"]
categories = ["command-line-utilities", "database"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlparser = { version = "0.55", features = ["visitor"] }
toml = "1.2.1"
